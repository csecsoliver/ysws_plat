syntax = "proto3";

package protobufschema;
option go_package = "olio.ovh/yswsplat/protobufschema";

service ReviewQueue {
	rpc InitProject (Project) returns (ProjectTicket);
	rpc GetProject (ProjectTicket) returns (Project);
    rpc Enqueue (Submission) returns (QueueTicket);
    rpc WatchStats (StatsRequest) returns (stream QueueStats);
    rpc BulkEnqueue (stream Submission) returns (QueueTicket);
    rpc ReviewSession (stream ReviewMessage) returns (stream Submission);
    
}

// Submission
message Submission {
	string project_uuid = 1;
	string comment = 2;
}

message QueueTicket {
    string uuid = 1;
}

// Project
message Project {
	string name = 1;
	string description = 2;
}
message ProjectTicket {
    string uuid = 1;
}




message StatsRequest {
    
}
message QueueStats {
    int64 unreviewed_count = 1;
}

message ReviewMessage {
    Verdict verdict = 1;
    string message = 2;
    string internal = 3;
}
enum Verdict {
    APPROVED = 0;
    CHANGES = 1;
    REJECTED = 2;
    FRAUD = 3;
}
